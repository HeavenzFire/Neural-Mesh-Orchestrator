name: Node build validation

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'server.ts'
      - '.github/workflows/node-build.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'server.ts'
      - '.github/workflows/node-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build frontend and server bundle
        run: npm run build
