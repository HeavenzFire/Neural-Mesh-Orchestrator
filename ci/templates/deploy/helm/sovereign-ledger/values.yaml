# Default values for sovereign-ledger

replicaCount: 3

image:
  repository: sovereign/sovereign-ledger
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

persistence:
  size: 10Gi
  storageClass: ""

# Base-12 radix configuration
radix:
  base: 12
  persistence: enabled
